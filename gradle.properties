# Project-wide Gradle settings for High Performance Configuration
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# JVM Configuration - Optimized for modern systems
org.gradle.jvmargs=-Xmx4096m -Xms2048m -XX:+UseParallelGC -XX:ParallelGCThreads=4 -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvmargs=-Xmx1024m

# Build Performance Optimizations
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.configuration-cache=true
org.gradle.build-cache=true
org.gradle.caching=true
org.gradle.vfs.watch=true

# Kotlin Compiler Options
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.cinterop=true
kotlin.native.useEmbeddableCompilerJar=true

# Android Options
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdkWarning=false

# Build features
android.enableViewBinding=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
